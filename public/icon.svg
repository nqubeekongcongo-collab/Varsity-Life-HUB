<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with subtle dark gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cccccc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="105" fill="none" stroke="#262626" stroke-width="6" />

  <!-- Centered Emblem (scaled from 100x100 viewBox to 512x512) -->
  <!-- Scale factor ~ 3.6, offset X: 76, Y: 70 -->
  <g transform="translate(76, 70) scale(3.6)" filter="url(#glow)">
    <!-- Mortarboard Cap Diamond Top -->
    <path
      d="M50 16 L84 28 L50 40 L16 28 Z"
      fill="#ffffff"
    />
    
    <!-- Cap Base under mortarboard -->
    <path
      d="M32 35 L50 41 L68 35 V42 C68 47 60 51 50 51 C40 51 32 47 32 42 Z"
      fill="#d4d4d4"
    />
    
    <!-- Cap Tassel Hanging -->
    <path
      d="M20 29.5 L18 42 C17 44 19 46 21 46 C23 46 25 44 24 42 L22 29.5"
      stroke="#e5e5e5"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="21" cy="44" r="2.5" fill="#ffffff" />

    <!-- Shield Outline Body -->
    <path
      d="M25 42 C25 66 38 78 50 84 C62 78 75 66 75 42"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Dynamic "V" Checkmark Crest -->
    <path
      d="M35 52 L50 71 L88 28"
      stroke="#ffffff"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M50 56 L42 45 M50 56 L58 45"
      stroke="#d4d4d4"
      stroke-width="3.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Clean Subtext in safe zone -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="6">VARSITY LIFE</text>
  <text x="256" y="475" text-anchor="middle" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" letter-spacing="10">HUB</text>
</svg>
